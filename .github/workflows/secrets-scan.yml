name: Secrets scan

# Defence-in-depth: even if the local pre-commit hook was bypassed
# (git commit --no-verify or an unconfigured clone), gitleaks scans
# every push and PR for known secret patterns across the full diff.
#
# Fails the workflow on any finding. To triage a false positive, edit
# .gitleaks.toml (checked into the repo).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so PRs get an accurate base…HEAD diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the job on any finding. Default is already 1, but pinning
          # for clarity.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
